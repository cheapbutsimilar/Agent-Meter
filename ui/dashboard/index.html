<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AgentMeter</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/widget.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region><span class="mark"></span><span data-tauri-drag-region>AgentMeter</span><span class="tb-ver" id="tb-ver" data-tauri-drag-region></span></div>
        <div class="tb-sp" data-tauri-drag-region></div>
        <button class="tb-update" id="tb-update" hidden></button>
        <div class="tb-status" id="tb-status" data-tauri-drag-region></div>
        <button class="tb-btn" id="btn-settings" data-i18n-title="tb.settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
        <button class="tb-btn" id="btn-refresh" data-i18n-title="tb.refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
        </button>
        <button class="tb-btn period" id="btn-period"></button>
        <button class="tb-btn" id="btn-min" data-i18n-title="tb.min"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
        <button class="tb-btn" id="btn-max" data-i18n-title="tb.max"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg></button>
        <button class="tb-btn close" id="btn-close" data-i18n-title="tb.close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
      </header>
      <div class="body">
        <nav class="side" id="nav">
          <button data-page="overview"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /></svg><span data-i18n="page.overview"></span></button>
          <button data-page="analytics"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8" /></svg><span data-i18n="page.analytics"></span></button>
          <button data-page="display"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg><span data-i18n="page.display"></span></button>
          <button data-page="appearance"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.4-9-7.4z" /><circle cx="7.5" cy="11" r="1.2" /><circle cx="10.5" cy="7.5" r="1.2" /><circle cx="15" cy="7.8" r="1.2" /></svg><span data-i18n="page.appearance"></span></button>
          <button data-page="agents"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="2.5" /><path d="M12 3v4M9 12h.01M15 12h.01M9.5 15.5h5" /></svg><span data-i18n="page.agents"></span></button>
          <button data-page="alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z" /><path d="M10 20.5a2 2 0 0 0 4 0" /></svg><span data-i18n="page.alerts"></span></button>
          <button data-page="general"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg><span data-i18n="page.general"></span></button>
          <div class="side-foot">
            <div class="side-row">
              <div class="side-label" data-i18n="side.layout"></div>
              <div class="side-hint" id="mode-hint"></div>
            </div>
            <div class="seg seg-mode" id="mode-switch">
              <button data-mode="taskbar" data-i18n-title="layout.strip"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h14" /></svg></button>
              <button data-mode="floating" data-i18n-title="layout.card"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5" /><path d="M8.5 8h7M8.5 12h7M8.5 16h4" /></svg></button>
            </div>
            <div class="side-links">
              <button class="side-link" data-url="https://github.com/cheapbutsimilar/Agent-Meter" data-i18n-title="side.github"><svg viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21" /></svg></button>
              <button class="side-link" data-url="https://github.com/sponsors/cheapbutsimilar" data-i18n-title="side.donate"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg></button>
            </div>
          </div>
        </nav>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <div class="modal-bg" id="notes-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="notes-title">
        <header>
          <h2 id="notes-title" data-i18n="notes.title"></h2>
          <span class="sp"></span>
          <button class="tb-btn" data-close data-i18n-title="tb.close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
        </header>
        <div class="modal-body" id="notes-body"></div>
      </div>
    </div>
    <div class="modal-bg" id="receipt-modal" hidden>
      <div class="modal rc-modal" role="dialog" aria-modal="true" aria-labelledby="receipt-title">
        <header>
          <h2 id="receipt-title" data-i18n="rc.title"></h2>
          <div class="seg seg-rc" id="rc-period">
            <button data-rc-period="today" data-i18n="rc.today"></button>
            <button data-rc-period="week" data-i18n="rc.week"></button>
            <button data-rc-period="month" data-i18n="rc.month"></button>
          </div>
          <span class="sp"></span>
          <button class="tb-btn" data-close data-i18n-title="tb.close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
        </header>
        <div class="modal-body rc-body">
          <div class="rc-shot"><img id="rc-img" alt="" /></div>
          <div class="rc-side" id="rc-fees"></div>
        </div>
        <footer class="rc-foot">
          <button class="btn primary" data-rc="x" data-i18n="rc.copy"></button>
          <button class="btn" data-rc="save" data-i18n="rc.save"></button>
          <button class="btn" data-rc="copy" data-i18n="rc.copyImg"></button>
          <span class="sp"></span>
          <span class="rc-note" data-i18n="rc.note"></span>
        </footer>
      </div>
    </div>
    <div id="tip" role="tooltip"></div>
    <div id="toast" role="status"></div>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/bridge.js"></script>
    <script src="../shared/util.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="../shared/logos.js"></script>
    <script src="../shared/render.js"></script>
    <script src="./receipt.js"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
