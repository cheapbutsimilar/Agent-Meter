<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AgentMeter</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/widget.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region><span class="mark"></span><span data-tauri-drag-region>AgentMeter</span><span class="tb-ver" id="tb-ver" data-tauri-drag-region></span></div>
        <div class="tb-sp" data-tauri-drag-region></div>
        <button class="tb-update" id="tb-update" hidden></button>
        <div class="tb-status" id="tb-status" data-tauri-drag-region></div>
        <button class="tb-btn" id="btn-settings" title="설정" aria-label="설정">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
        <button class="tb-btn" id="btn-refresh" title="지금 새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
        </button>
        <button class="tb-btn" id="btn-min" title="최소화" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
        <button class="tb-btn" id="btn-max" title="최대화" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg></button>
        <button class="tb-btn close" id="btn-close" title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
      </header>
      <div class="body">
        <nav class="side" id="nav">
          <button data-page="overview"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /></svg>개요</button>
          <button data-page="analytics"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8" /></svg>분석</button>
          <button data-page="display"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>위젯 표시</button>
          <button data-page="appearance"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.4-9-7.4z" /><circle cx="7.5" cy="11" r="1.2" /><circle cx="10.5" cy="7.5" r="1.2" /><circle cx="15" cy="7.8" r="1.2" /></svg>모양</button>
          <button data-page="agents"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="2.5" /><path d="M12 3v4M9 12h.01M15 12h.01M9.5 15.5h5" /></svg>에이전트</button>
          <button data-page="alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z" /><path d="M10 20.5a2 2 0 0 0 4 0" /></svg>알림 · 단축키</button>
          <button data-page="general"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg>일반</button>
          <div class="side-foot">
            <div class="side-label">위젯 레이아웃</div>
            <div class="seg seg-mode" id="mode-switch">
              <button data-mode="taskbar">가로형</button>
              <button data-mode="floating">카드형</button>
            </div>
            <div class="side-hint" id="mode-hint"></div>
          </div>
        </nav>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <div class="modal-bg" id="notes-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="notes-title">
        <header>
          <h2 id="notes-title">패치노트</h2>
          <span class="sp"></span>
          <button class="tb-btn" data-close title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
        </header>
        <div class="modal-body" id="notes-body"></div>
      </div>
    </div>
    <div id="tip" role="tooltip"></div>
    <div id="toast" role="status"></div>
    <script src="../shared/bridge.js"></script>
    <script src="../shared/util.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="../shared/logos.js"></script>
    <script src="../shared/render.js"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
