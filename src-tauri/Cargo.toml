[package]
name = "agentmeter"
description = "AgentMeter — usage monitor for Claude Code, Codex, Gemini CLI, Antigravity and Grok"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "agentmeter"

[lib]
name = "agentmeter_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentmeter-antigravity = { path = "../crates/antigravity" }
sys-locale = "0.3"
agentmeter-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[features]
# Serve the bundled ui/ folder (also for plain `cargo build`; `cargo tauri dev` drops it
# automatically and serves ui/ with live reload instead).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
