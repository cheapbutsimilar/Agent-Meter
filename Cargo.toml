[workspace]
members = ["crates/core", "crates/antigravity", "crates/devserver", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.33"
edition = "2021"
license = "MIT"
authors = ["AgentMeter contributors"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
