[package]
name = "agentmeter-antigravity"
description = "Native Windows Antigravity quota collection, without scripting runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Security_WinTrust",
  "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
  "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory",
] }
