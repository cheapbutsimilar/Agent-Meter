[package]
name = "agentmeter-core"
description = "Usage collectors (Claude, Codex, Gemini, Antigravity, Grok) for AgentMeter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentmeter-antigravity = { path = "../antigravity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
