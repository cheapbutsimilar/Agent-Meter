name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Linux 설치 파일도 만들기 (기본: Windows + macOS)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p agentmeter-core
      - name: UI strings in every language
        run: node scripts/check-i18n.js

  # The whole app (Tauri shell included) has to build, lint and test on both desktops it ships for.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  bundle:
    # Installers are built on demand (Actions → CI → Run workflow) or for v* tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Manual runs build Windows + macOS unless asked for Linux too; v* tags build everything.
        platform: ${{ fromJSON((github.event_name == 'push' || inputs.all_platforms) && '["windows-latest","macos-latest","ubuntu-22.04"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: agentmeter-${{ matrix.platform }}
          path: |
            target/release/agentmeter.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
